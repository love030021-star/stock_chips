name: 個股補歷史資料

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "最多補幾分鐘"
        default: "150"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 補個股歷史
        env:
          TZ: Asia/Taipei
        run: |
          python scripts/stocks.py --backfill "${{ github.event.inputs.minutes || 150 }}"

      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "個股補歷史 $(TZ=Asia/Taipei date +%F)"
            git pull --rebase -X theirs origin main || true
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
