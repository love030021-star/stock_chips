name: 每日更新與部署

on:
  schedule:
    # 台北時間週一到週五 21:47、23:17（UTC 13:47、15:17）：期交所盤後資料，第二次是補跑。
    - cron: "47 13 * * 1-5"
    - cron: "17 15 * * 1-5"
    # 台北時間週二到週六 06:17（美股收盤後），更新小娜、黃金、原油
    - cron: "17 22 * * 1-5"
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # 只部署網頁（push）不必等資料更新或補歷史跑完
  group: ${{ github.event_name == 'push' && 'deploy-only' || 'daily-update' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓資料並計分
        if: github.event_name != 'push'
        env:
          TZ: Asia/Taipei
        run: |
          python scripts/update.py

      - name: 提交資料
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date +%F)"
            git pull --rebase -X theirs origin main || true
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
